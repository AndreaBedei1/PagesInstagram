name: CI

# Every branch and every pull request. The previous release's final commit had
# no visible status, so the first thing this has to be is *observable*: the job
# names below are what shows up next to the commit.
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Nothing in CI may reach a real account. The smoke test refuses to run in any
  # other mode, so this is a belt as well as braces.
  ICE_MODE: dry_run
  PYTHONIOENCODING: utf-8

jobs:
  test:
    name: test (python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python ${{ matrix.python-version }}
        run: uv venv .venv --python ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv pip install --python .venv/bin/python -r requirements.txt

      # Catches a syntax error in a module no test imports — cheap, and it fails
      # in two seconds instead of thirty in the middle of a suite.
      - name: Byte-compile everything
        run: .venv/bin/python -m compileall -q src tools

      - name: Unit and integration tests
        run: >-
          .venv/bin/python -m pytest -q -m "not e2e"
          --cov=src --cov-report=term-missing

      # The 5.000-item datasets take a while to validate with quality scoring;
      # the structural, language, history and word checks are the point here.
      - name: Validate datasets
        run: .venv/bin/python -m src.cli validate-datasets --skip-quality

      - name: Editorial repetition analysis
        run: .venv/bin/python -m src.cli editorial-stats

      - name: Secret scan
        run: .venv/bin/python -m src.cli security-check

      # The reproducible five-page dry-run. No GPU, no ComfyUI, no network:
      # backgrounds come from the deterministic fallback, publication is mocked
      # by dry-run mode. A fixed date keeps the run comparable over time.
      - name: Five-page preproduction smoke test
        run: .venv/bin/python -m src.cli preproduction-smoke-test --date 2026-08-07

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports-py${{ matrix.python-version }}
          path: |
            reports/preproduction_smoke_test.json
            reports/datasets_validation.json
            reports/editorial_stats.json
          if-no-files-found: warn
          retention-days: 14
