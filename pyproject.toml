[project]
name = "instagram-content-engine"
version = "0.1.0"
description = "Modular, multi-account engine that generates and publishes daily Instagram content (feed + stories) with ComfyUI backgrounds, deterministic typography, mood-matched music and official Meta Graph API publishing."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Instagram Content Engine" }]

dependencies = [
    "pyyaml>=6.0.2",
    "pydantic>=2.9",
    "python-dotenv>=1.0",
    "requests>=2.32",
    "pillow>=11.0",
    "numpy>=2.1",
    "rapidfuzz>=3.10",
    "imageio-ffmpeg>=0.5",
    "APScheduler>=3.10,<4",
    "tzdata>=2024.1",
    "typer>=0.12",
    "rich>=13.9",
    "jinja2>=3.1",
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "python-multipart>=0.0.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
]

[project.scripts]
ice = "src.cli.main:app"

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra -q"
markers = [
    "integration: tests that need external services (ComfyUI, ffmpeg)",
    "e2e: end-to-end dry-run pipeline tests",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["src"]
