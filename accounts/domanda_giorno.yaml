# Pagina 5 — Una Domanda al Giorno (domande originali, non intrusive).
# Segreti SOLO da .env:
#   ICE_DOMANDA_GIORNO_IT_IG_USER_ID / ICE_DOMANDA_GIORNO_IT_ACCESS_TOKEN
page_id: domanda_giorno_it
enabled: true
display_name: Una Domanda al Giorno
content_type: daily_question
language: it

publishing:
  posts_per_day: 1
  publish_feed: true
  publish_story: false
  publish_reel: false
  feed_time: "20:30"
  story_time: "22:30"
  timezone: "Europe/Rome"
  missed_job_policy: publish_within_window
  missed_job_window_minutes: 240
  upload_method: resumable
  feed_media_type: REELS
  share_reel_to_feed: true
  story_media_type: STORIES

instagram:
  account_type: business
  api_flavor: instagram_login

visual:
  style: dark_minimal
  template: daily_question
  show_author: false
  font_family: default
  background_profile: question_dark_minimal
  logo_enabled: true
  logo_text: "@una.domanda.al.giorno"

music:
  enabled: false
  profile: ambient

content:
  source: database
  minimum_quality_score: 0.70
  avoid_semantic_duplicates: true
  selection_policy: cyclic_ordered
  cycle_anchor_date: "2026-01-01"
  cycle_length: 1000

generation:
  prepare_ahead_days: 30
  planning_horizon_days: 60
  published_media_retention_days: 45
